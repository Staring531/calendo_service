name: "Investigation / 技术调查"
description: "A question that needs evidence before anyone decides or builds. / 需要先拿到证据、才能决定或动手的问题。"
title: "[investigation] "
labels: ["type:investigation"]
body:
  - type: textarea
    id: question
    attributes:
      label: The question / 要回答的问题
      description: |
        One question, phrased so that evidence can answer it.
        一个问题，写成能用证据回答的形式。
      placeholder: Does holidays 0.108 mark 2026-10-10 in CN as a working day? / holidays 0.108 是否把 CN 的 2026-10-10 判定为工作日？
    validations:
      required: true

  - type: textarea
    id: decision
    attributes:
      label: What it unblocks / 它决定什么
      description: |
        The decision, design or change that waits on the answer.
        等这个答案的决定、设计或改动。
    validations:
      required: true

  - type: textarea
    id: known
    attributes:
      label: Known so far / 已知事实
      description: |
        Facts with their sources. Mark a guess as a guess.
        已知事实及来源。推测要标明是推测。
    validations:
      required: false

  - type: textarea
    id: answer
    attributes:
      label: What would answer it / 怎样算有答案
      description: |
        The evidence that would settle it: a test run, a document, a measurement.
        什么证据能给出结论：一次测试运行、一份文档、一次测量。
    validations:
      required: false
