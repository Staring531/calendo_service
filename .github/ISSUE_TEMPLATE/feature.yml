name: "需求 / Feature"
description: "记录需要解决的问题、预期结果和可验证的验收条件。"
title: "[需求] "
body:
  - type: markdown
    attributes:
      value: "描述需要交付的能力或改进。请先描述问题和结果，不要预设未经调查的技术实现。"
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 当前遇到什么问题、限制或机会？谁或什么受到影响？
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 预期结果
      description: 完成后应发生什么变化？如何判断结果有价值？
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 本次范围
      description: 明确本次需要包含和不包含的内容。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收条件
      description: 每条条件都应能通过检查、测试、演示或其他证据判断。
      placeholder: |
        - [ ] 在……条件下，系统应……
        - [ ] 当……发生时，应……
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: 已知约束与依赖
      description: 记录已知限制、依赖、兼容性或时间约束；未知项请标记为待调查。
    validations:
      required: false
  - type: textarea
    id: evidence
    attributes:
      label: 参考资料与证据
      description: 填写相关链接、截图说明或现有行为记录，并注明来源。
    validations:
      required: false
