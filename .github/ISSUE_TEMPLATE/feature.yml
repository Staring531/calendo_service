name: "Feature request / 需求"
description: "Something Calendo should be able to answer or do. / Calendo 应当能够回答或做到的事。"
title: "[feature] "
labels: ["type:feature"]
body:
  - type: markdown
    attributes:
      value: |
        A request one pull request cannot deliver becomes a parent. The agent cuts it into stories and opens each sub-issue. A story states the behaviour a caller can observe, what it leaves out, the source of every date fact or the gap, and the checks that show it is done without reading the code. Work starts when the owner comments a line `Adopted` on that sub-issue. The parent stays open.
        一个 pull request 做不完的请求成为父 issue。Agent 把它切成 story，并自己开每一条子 issue。一张 story 写明调用方能看到的行为、范围外的内容、每个日期事实的来源或缺口，以及不看代码就能核对的完成标准。所有者在该子 issue 上评论单独一行 `Adopted`，工作才开始。父 issue 保持打开。

  - type: textarea
    id: problem
    attributes:
      label: The problem / 要解决的问题
      description: |
        Who is asking what, and where Calendo gets in the way today. A concrete question someone asks is worth more than a feature name.
        谁在问什么，Calendo 目前卡在哪里。一句真实会被问到的话，比一个功能名称更有用。
      placeholder: 「下周三之后的第 5 个工作日是哪天？」
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What it should do / 期望的行为
      description: |
        The answer you expect, and where it would come from: an MCP tool, an HTTP endpoint, or the site.
        期望得到的回答，以及从哪里得到：MCP 工具、HTTP 接口，还是官网。
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: How to tell it is done / 如何判断完成
      description: |
        Questions with their right answers, each checkable without reading the code. Say where each answer comes from.
        带标准答案的问题，每条都不看代码就能核对。写明每个答案的依据。
      placeholder: |
        - 2025-10-11 in CN is adjusted_workday (source: 国务院办公厅 2025 年放假通知)
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What you do instead today / 目前的替代做法
    validations:
      required: false
