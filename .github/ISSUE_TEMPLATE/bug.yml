name: "Bug report / 缺陷报告"
description: "A tool, an endpoint or the site does not do what its description says. A wrong date goes in the data form. / 工具、接口或官网没有按说明工作。日期判定错误请用数据表单。"
title: "[bug] "
labels: ["type:bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please search the [open issues](https://github.com/Staring531/calendo_service/issues) first. A security problem goes to the [security policy](https://github.com/Staring531/calendo_service/blob/main/.github/SECURITY.md), not here.
        请先搜索[已有的 issue](https://github.com/Staring531/calendo_service/issues)。安全问题请按[安全策略](https://github.com/Staring531/calendo_service/blob/main/.github/SECURITY.zh.md)私下报告，不要发在这里。

  - type: textarea
    id: summary
    attributes:
      label: What happened / 问题描述
      description: |
        What you called, what you expected, and what came back instead.
        你调用了什么，期望得到什么，实际返回了什么。
    validations:
      required: true

  - type: textarea
    id: request
    attributes:
      label: The request / 请求
      description: |
        The MCP tool and its arguments, or the HTTP method, path and query, exactly as sent.
        MCP 工具及其参数，或 HTTP 方法、路径与查询参数，按实际发送的原样填写。
      placeholder: |
        GET /v1/workdays/count?country=CN&from=2025-09-29&to=2025-10-12
      render: text
    validations:
      required: true

  - type: textarea
    id: response
    attributes:
      label: The response / 返回内容
      description: |
        The body or the error, including `data_version` when there is one.
        返回正文或错误信息；有 `data_version` 时一并贴上。
      render: text
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: Where it ran / 运行环境
      description: |
        The public endpoint, the site, or a local run (with the version or commit). For MCP, the client and its version.
        公共端点、官网，还是本地运行（写明版本或 commit）。MCP 请写明客户端及版本。
    validations:
      required: true
