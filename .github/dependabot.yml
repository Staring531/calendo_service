# Weekly, grouped, one PR per ecosystem. These PRs carry `skip-changelog`: a tool bump changes
# nothing a user reads or runs. Remove the label if a bump does change behaviour.
#
# `holidays` decides every date fact Calendo returns, so its upgrades are never automatic: one is
# a data change, made by hand with the diff of every (country, year) block it moves.
version: 2
updates:
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
    labels: [dependencies, skip-changelog]
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
    labels: [dependencies, skip-changelog]
    ignore:
      - dependency-name: holidays
    groups:
      python:
        patterns: ["*"]
