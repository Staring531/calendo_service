name: ADR governance tests

on:
  pull_request:
    paths:
      - "docs/decisions/**"
      - "AGENTS.md"
      - "tests/test_adr_governance.py"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: pytest tests/test_adr_governance.py -v
