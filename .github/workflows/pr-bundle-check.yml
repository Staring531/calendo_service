name: PR bundle check (test + code + changelog)

on:
  pull_request:
    branches: [master]

jobs:
  check-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Save PR body
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: echo "$PR_BODY" > /tmp/pr_body.txt
      - name: Check test/code/changelog bundle
        run: |
          python3 scripts/check_pr_bundle.py \
            --base origin/${{ github.base_ref }} \
            --head HEAD \
            --src-paths-file docs/decisions/src-paths.txt \
            --changelog-path-prefix CHANGELOG/ \
            --pr-body-file /tmp/pr_body.txt
