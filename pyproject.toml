[project]
name = "calendo"
version = "0.0.0"
description = "Holiday and working-day answers for AI agents, with every date's source stated."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Staring531" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Repository = "https://github.com/Staring531/calendo_service"
Changelog = "https://github.com/Staring531/calendo_service/blob/main/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.11.32,<0.12"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.11.32,<0.12"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PT", "PTH", "DTZ"]

[tool.pyright]
include = ["src", "scripts", "tests"]
extraPaths = ["scripts", "tests/tooling"]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["scripts", "tests/tooling"]
addopts = ["--disable-socket", "--strict-markers", "--strict-config", "-ra"]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["src", "scripts"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[dependency-groups]
dev = [
    "actionlint-py>=1.7.12.25",
    "pyright[nodejs]>=1.1.414",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-socket>=0.8.1",
    "ruff>=0.17.3",
]
