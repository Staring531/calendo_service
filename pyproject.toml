[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "calendo"
version = "0.1.0"
description = "跨国公共假日 MCP 服务，面向 AI agent/LLM 客户端，支持多语言"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [
    { name = "Calendo INC", email = "support@calendo.day" }
]
keywords = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
dependencies = [
    "holidays>=0.105",
    "mcp<2",
]

[project.scripts]
calendo = "calendo.server:main"
calendo-http = "calendo.server:http_main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]



[tool.hatch.build.targets.wheel]
packages = ["src/calendo"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501",   # 行长度交给 formatter 处理
    "RUF001", # 允许中文全角标点出现在字符串里
    "RUF002", # 允许中文全角标点出现在 docstring 里
    "RUF003", # 允许中文全角标点出现在注释里
]

[tool.ruff.lint.isort]
known-first-party = ["calendo"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.14"
mypy_path = "src"
packages = ["calendo"]
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=src --cov-report=term-missing"
python_files = ["test_*.py"]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
